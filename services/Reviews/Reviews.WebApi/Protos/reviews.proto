syntax = "proto3";

option csharp_namespace = "Reviews.Grpc";

package reviews;

service ReviewsService {
  rpc GetForProduct (GetForProductRequest) returns (ReviewsListReply);
}

message GetForProductRequest {
  int64 product_id = 1;
}

message ReviewReply {
  string id = 1;
  int64 product_id = 2;
  string author_name = 3;
  int32 rating = 4;
  string text = 5;
}

message ReviewsListReply {
  repeated ReviewReply items = 1;
}